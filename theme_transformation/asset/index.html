<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Transformation Challenge</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #343a40;
            --card-bg: #ffffff;
            --card-border: #dee2e6;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --accent-color: #495057;
        }

        [data-theme="dark"] {
            --bg-color: #343a40;
            --text-color: #f8f9fa;
            --card-bg: #495057;
            --card-border: #6c757d;
            --primary-color: #17a2b8;
            --secondary-color: #adb5bd;
            --accent-color: #e9ecef;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 20px;
        }

        .navbar {
            background-color: var(--primary-color);
            padding: 10px 0;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 18px;
        }

        .navbar a:hover {
            background-color: var(--secondary-color);
            border-radius: 5px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 20px;
        }

        .toggle-container {
            margin: 20px 0;
        }

        .toggle-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .toggle-button:hover {
            background-color: var(--secondary-color);
        }

        h1 {
            color: var(--primary-color);
            font-weight: bold;
        }

        p {
            color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
        }

        .card:hover {
            transform: scale(1.02);
            border-color: var(--primary-color);
            box-shadow: 0px 2px 10px rgba(0, 123, 255, 0.2);
        }

        h2 {
            color: var(--secondary-color);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
    <div class="container">
        <h1>Theme Transformation Challenge</h1>
        <p>Convert this light theme into a dark theme using CSS variables.</p>
        
        <div class="toggle-container">
            <button class="toggle-button" onclick="toggleTheme()">Toggle Dark Mode</button>
        </div>
        
        <div class="card">
            <h2>Card Title</h2>
            <p>This is a sample card. Adjust the background, text color, and borders for a dark theme.</p>
        </div>
    </div>
    
    <script>
        function toggleTheme() {
            //write your code here 
        }
    </script>
</body>
</html>
