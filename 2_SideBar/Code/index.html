<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Menu with Custom Icons</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
      }

      .sidebar {
        width: 250px;
        background: #fff;
        border-right: 1px solid #ddd;
        height: 100vh;
        padding-top: 20px;
      }

      .sidebar h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .sidebar ul {
        list-style: none;
        padding: 0;
      }

      .sidebar ul li {
        padding: 15px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #333;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .sidebar ul li:hover {
        background: #e6d6f2;
      }

      .sidebar ul li.active {
        background: #d1b3f1;
      }

      .sidebar ul li img {
        width: 20px;
        height: 20px;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <h2>Menu</h2>
      <ul>
        <li class="active">
          <img src="icons/dashboard.svg" alt="Dashboard Icon" /> Dashboard
        </li>
        <li>
          <img src="icons/shortcuts.svg" alt="Shortcuts Icon" /> Shortcuts
        </li>
        <li><img src="icons/overview.svg" alt="Overview Icon" /> Overview</li>
        <li><img src="icons/events.svg" alt="Events Icon" /> Events</li>
        <li><img src="icons/about.svg" alt="About Icon" /> About</li>
        <li><img src="icons/services.svg" alt="Services Icon" /> Services</li>
        <li><img src="icons/contact.svg" alt="Contact Icon" /> Contact</li>
      </ul>
    </div>
  </body>
</html>
